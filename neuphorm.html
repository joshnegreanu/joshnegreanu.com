    <script>
        marked.use({
            renderer: {
                html(token) {
                    const raw = typeof token === 'object' ? token.text : token;
                    const escaped = raw
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                    return '<pre><code>' + escaped + '</code></pre>\n';
                }
            }
        });
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);
    </script>
